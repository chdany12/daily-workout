name: Daily workout

on:
  schedule:
    - cron: "7 11 * * *"   # every day 11:07 UTC (3:07 am Pacific / 6:07 am Eastern)
    # GitHub often delays or skips scheduled runs, so retry through the day.
    # Each run keeps today's workout if it already exists, so extra runs change nothing.
    - cron: "37 9,13,15,17,20 * * *"
  workflow_dispatch:         # "Run workflow" button for a manual run
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-workout
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python -m unittest -v
      - run: python build_site.py
      - name: Save today's workout + novelty memory
        run: |
          git config user.name "workout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Workout for $(ls data/workouts | sort | tail -1 | cut -d. -f1)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
